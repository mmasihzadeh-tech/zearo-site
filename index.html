<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070a0d" />
  <meta name="description" content="ZEARO | Control - Accounting - Insight. Coming soon." />
  <title>ZEARO | Coming Soon</title>
  <style>
    :root{
      --fg:#f4f7f8;
      --muted:rgba(244,247,248,.66);
      --line:rgba(255,255,255,.18);
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      overflow:hidden;
      background:#05070a;
      color:var(--fg);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .stage{
      position:fixed;
      inset:0;
      width:100vw;
      height:100dvh;
      isolation:isolate;
      overflow:hidden;
      background:#05070a;
    }

    /* The source video itself now fills the entire viewport. */
    .hero-video{
      position:absolute;
      inset:0;
      z-index:-4;
      width:100vw;
      height:100%;
      min-width:100%;
      min-height:100%;
      object-fit:cover;
      object-position:center center;
      filter:saturate(.88) contrast(1.06) brightness(.72);
    }

    .veil{
      position:absolute;
      inset:0;
      z-index:-3;
      background:
        radial-gradient(circle at 50% 43%, transparent 0 12%, rgba(2,4,7,.06) 34%, rgba(2,4,7,.30) 80%),
        linear-gradient(to bottom, rgba(3,5,8,.26), rgba(3,5,8,.03) 30%, rgba(3,5,8,.06) 62%, rgba(3,5,8,.52));
    }

    .grain{
      position:absolute;
      inset:0;
      z-index:-2;
      opacity:.045;
      pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.62'/%3E%3C/svg%3E");
    }

    .top{
      position:absolute;
      top:max(24px,env(safe-area-inset-top));
      left:max(24px,env(safe-area-inset-left));
      right:max(24px,env(safe-area-inset-right));
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:24px;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:11px;
      color:rgba(255,255,255,.76);
    }

    .brand{font-weight:700;letter-spacing:.30em}
    .status{display:flex;align-items:center;gap:9px;white-space:nowrap}
    .dot{
      width:5px;height:5px;border-radius:50%;
      background:#eef2f3;
      box-shadow:0 0 14px rgba(255,255,255,.78);
    }

    .center{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:100px 24px;
      text-align:center;
    }

    .panel{
      width:min(720px,92vw);
      padding:44px 24px 40px;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      background:linear-gradient(90deg,transparent,rgba(5,8,11,.14),transparent);
      backdrop-filter:blur(1.5px);
      -webkit-backdrop-filter:blur(1.5px);
      animation:appear 1.35s cubic-bezier(.2,.72,.2,1) both;
    }

    .eyebrow{
      margin:0 0 18px;
      font-size:10px;
      line-height:1;
      font-weight:600;
      letter-spacing:.36em;
      text-transform:uppercase;
      color:rgba(255,255,255,.68);
    }

    h1{
      margin:0;
      font-size:clamp(38px,6.6vw,82px);
      line-height:.96;
      font-weight:300;
      letter-spacing:.08em;
      text-transform:uppercase;
      text-shadow:0 2px 34px rgba(0,0,0,.46);
    }

    .sub{
      margin:22px 0 0;
      font-size:clamp(10px,1.2vw,13px);
      font-weight:500;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .bottom{
      position:absolute;
      left:max(24px,env(safe-area-inset-left));
      right:max(24px,env(safe-area-inset-right));
      bottom:max(22px,env(safe-area-inset-bottom));
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:24px;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(255,255,255,.50);
    }

    .line{width:64px;height:1px;background:rgba(255,255,255,.28);margin-bottom:6px}

    @keyframes appear{
      from{opacity:0;transform:translateY(16px);filter:blur(5px)}
      to{opacity:1;transform:translateY(0);filter:blur(0)}
    }

    @media (max-width:640px){
      .top{top:max(18px,env(safe-area-inset-top));left:18px;right:18px}
      .top .status{display:none}
      .center{padding:84px 18px}
      .panel{padding:34px 10px 30px;width:100%}
      .eyebrow{letter-spacing:.28em}
      h1{letter-spacing:.055em}
      .sub{line-height:1.8;letter-spacing:.19em}
      .bottom{left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom))}
      .bottom .right{display:none}
      .hero-video{object-position:center center}
    }

    @media (prefers-reduced-motion:reduce){.panel{animation:none}}
  </style>
</head>
<body>
  <main class="stage">
    <video class="hero-video" autoplay muted loop playsinline preload="auto">
      <source src="assets/zearo-coming-soon.mp4" type="video/mp4">
    </video>

    <div class="veil"></div>
    <div class="grain"></div>

    <header class="top">
      <div class="brand"><img src="assets/zearo-logo-system.png" alt="ZEARO" style="display:block;width:140px;max-width:28vw;height:auto;"></div>
      <div class="status"><span class="dot"></span><span>Preparing for launch</span></div>
    </header>

    <section class="center" aria-label="ZEARO coming soon">
      <div class="panel">
        <p class="eyebrow">A new standard is taking shape</p>
        <h1>We Are<br>Coming Soon</h1>
        <p class="sub">Control&nbsp;&nbsp;&bull;&nbsp;&nbsp;Accounting&nbsp;&nbsp;&bull;&nbsp;&nbsp;Insight</p>
      </div>
    </section>

    <footer class="bottom">
      <div><div class="line"></div><div>zearo.ir</div></div>
      <div class="right">Built for clarity</div>
    </footer>
  </main>

  <script>
    const video=document.querySelector('.hero-video');
    const start=()=>video.play().catch(()=>{});
    start();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)start();});
  </script>
</body>
</html>
